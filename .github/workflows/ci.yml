name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go race, vet and build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Tests with race detection
        run: go test -race ./internal/... ./cmd/...
      - name: Vet
        run: go vet ./internal/... ./cmd/...
      - name: Build all commands
        run: go build ./cmd/...
